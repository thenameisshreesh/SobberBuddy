name: sober_buddy_driver
description: SoberBuddyDriver - Flutter driver app for SoberBuddy ride-hailing platform.
publish_to: 'none'
version: 1.0.3+20

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  cloud_functions: ^5.3.4
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.5
  flutter_local_notifications: ^18.0.1
  provider: ^6.1.4
  go_router: ^14.8.1
  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  ionicons: ^0.2.2
  url_launcher: ^6.3.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/map_dark_style.json
