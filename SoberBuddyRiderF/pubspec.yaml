name: sober_buddy_rider
description: SoberBuddy Rider - consumer ride-hailing app
publish_to: 'none'
version: 1.0.3+11

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.0.0
  firebase_messaging: ^16.0.0
  firebase_storage: ^13.0.0
  flutter_local_notifications: ^18.0.1
  mobile_scanner: ^7.0.0
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  http: ^1.6.0
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  url_launcher: ^6.3.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/adaptive-icon.png
    - assets/adaptive-icon-new.png
    - assets/splash.png
    - assets/favicon.png
